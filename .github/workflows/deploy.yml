name: Deploy to Oracle Cloud VPS

on:
  release:
    types: [published]
  schedule:
    - cron: "0 14 * * 5"
  workflow_dispatch:

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ubuntu
  APP_DIR: /home/ubuntu/furniture

jobs:
  build-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Infisical CLI
        run: curl -1sLf 'https://raw.githubusercontent.com/Infisical/infisical/main/scripts/install.sh' | bash

      - name: Export secrets to .env
        run: |
          export INFISICAL_TOKEN=$(curl -s -X POST https://app.infisical.com/api/v1/auth/universal-auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken')
          infisical export --token "$INFISICAL_TOKEN" \
            --projectId 9a8d77c4-cf7e-4230-a9cd-6d60dc2bca4b \
            --env prod \
            --path /furniture \
            --format dotenv > .env.deploy

      - name: Install and build frontend
        run: |
          npm ci
          set -a && source .env.deploy && set +a
          npm run build

      - name: Build backend
        working-directory: ./backend
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy frontend
        run: |
          rsync -avz --delete \
            dist/ \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.APP_DIR }}/frontend/

      - name: Deploy backend
        run: |
          rsync -avz --delete \
            backend/dist/ \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.APP_DIR }}/backend/dist/

          rsync -avz \
            backend/package.json \
            backend/package-lock.json \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.APP_DIR }}/backend/

      - name: Deploy .env and restart
        run: |
          scp .env.deploy ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.APP_DIR }}/backend/.env

          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
            cd /home/ubuntu/furniture/backend
            npm ci --omit=dev

            if pm2 describe furniture-api > /dev/null 2>&1; then
              pm2 restart furniture-api
            else
              pm2 start dist/server.js \
                --name furniture-api \
                --node-args="--max-old-space-size=256 --env-file=.env" \
                --max-memory-restart 200M
            fi

            pm2 save
          EOF

      - name: Verify
        run: |
          sleep 5
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "pm2 status"
